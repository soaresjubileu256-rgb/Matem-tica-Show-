<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- sem maximum-scale: quem precisa pode ampliar a tela com os dedos (acessibilidade) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Política de segurança: só roda scripts do próprio app (nada de scripts injetados por dados importados);
     estilos inline são usados pelo app; fontes vêm do Google Fonts; o feedback abre o Formulário Google numa aba. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Matemática Show</title>

<!-- PWA: manifest + cor do tema + ícones -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070F">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<!-- iOS não lê o manifest.json pra isso, precisa dessas tags separadas -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mat. Show">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Seu professor de matemática digital — aprenda, pratique e resolva questões passo a passo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
