<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Matemática Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#07070F;
  --paper-line:rgba(255,255,255,.05);
  --ink:#F1F1FA;
  --ink-soft:#9591B8;
  --pine:#33D2E3;
  --pine-deep:#10101C;
  --amber:#4C7DFF;
  --amber-deep:#B23FE0;
  --coral:#FF5C7A;
  --coral-deep:#FF5C7A;
  --coral-bg:rgba(255,92,122,.12);
  --teal:#33D2E3;
  --leaf-bg:rgba(51,210,227,.12);
  --white:#151830;
  --surface-2:#1C1F3B;
  --border:rgba(255,255,255,.09);
  --border-soft:rgba(255,255,255,.07);
  --radius-hero:28px;
  --radius-card:18px;
  --radius-chip:999px;
  --shadow-ink: 0 16px 40px -20px rgba(0,0,0,.7);
  --shadow-soft: 0 6px 18px -10px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:
    radial-gradient(720px 420px at 10% -8%, rgba(76,125,255,.14), transparent 60%),
    radial-gradient(620px 520px at 100% 0%, rgba(178,63,224,.10), transparent 55%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:88px;
  position:relative;
}
h1,h2,h3{font-family:'Fraunces', serif; margin:0; color:var(--ink); letter-spacing:-0.015em; font-weight:600;}
.mono{font-family:'JetBrains Mono', monospace;}
button{font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none;}
input,textarea{font-family:inherit; -webkit-appearance:none; appearance:none;}
a{color:inherit;}

/* ---------- header ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:20px 20px 12px;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--white);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;flex-shrink:0;
  box-shadow:var(--shadow-soft);
  transition:transform .15s ease, background .15s ease;
}
.back-btn:active{ transform:scale(0.94); background:var(--surface-2); }
.topbar .brand{
  display:flex;align-items:center;gap:10px;
}
.topbar .brand .mark{
  width:34px;height:34px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 12px rgba(76,125,255,.4));
}
.topbar .brand .mark img{width:100%;height:100%;display:block;object-fit:contain;}
.topbar h1{font-size:19px; font-weight:600;}
.topbar .screen-title{font-size:18px;font-weight:600; font-family:'Fraunces',serif; color:var(--ink);}

.content{padding:8px 20px 20px;}

/* ---------- home ---------- */
.greeting{padding:2px 20px 16px;}
.greeting p{margin:3px 0 0; color:var(--ink-soft); font-size:14px;}
.greeting h2{font-size:26px;}

.hero-tile{
  margin:10px 20px 20px;
  background:linear-gradient(155deg, #1B1E3B 0%, #0F0E1B 100%);
  border:1px solid var(--border);
  border-radius:var(--radius-hero);
  padding:22px 22px 24px;
  position:relative;
  box-shadow:var(--shadow-ink);
  overflow:hidden;
}
.hero-tile::after{
  content:"";
  position:absolute; right:-30px; bottom:-30px;
  width:150px;height:150px;
  background:radial-gradient(circle, rgba(178,63,224,.18) 0%, transparent 70%);
  border-radius:50%;
}
.hero-tile .eyebrow-sym{
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12.5px;
  background:rgba(76,125,255,.16); color:#8CACFF;
  display:inline-block; padding:4px 11px; border-radius:8px;
  border:1px solid rgba(76,125,255,.3);
}
.hero-tile h2{font-size:23px; margin-top:12px; color:var(--ink);}
.hero-tile p{margin:8px 0 16px; color:var(--ink-soft); opacity:1; font-size:14px; max-width:82%; position:relative; z-index:1;}
.hero-tile button{
  border:none; background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#fff;
  padding:12px 20px; border-radius:var(--radius-chip); font-weight:700; font-size:14.5px;
  display:inline-flex; align-items:center; gap:8px;
  box-shadow:0 8px 22px -8px rgba(120,80,240,.6);
  position:relative; z-index:1;
  transition:transform .15s ease;
}
.hero-tile button:active{transform:scale(0.97);}

/* ---------- home: aviso de erros pendentes (banner compacto) ---------- */
.alert-banner{
  display:flex; align-items:center; gap:12px; width:calc(100% - 40px);
  margin:0 20px 18px; padding:14px 15px; border-radius:16px;
  border:1px solid rgba(255,92,122,.3); background:rgba(255,92,122,.08);
  text-align:left; transition:transform .15s ease;
}
.alert-banner:active{transform:scale(0.98);}
.alert-banner .sym{
  width:38px;height:38px;border-radius:11px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center; font-size:17px;
  background:rgba(255,92,122,.16);
}
.alert-banner .txt{flex:1; min-width:0;}
.alert-banner .txt .title{font-weight:700; font-size:14px; color:var(--ink); font-family:'Fraunces',serif; display:block;}
.alert-banner .txt .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:block;}
.alert-banner .chev{font-size:19px; color:var(--coral); flex-shrink:0;}

/* ---------- home: grade de acesso rápido (ações secundárias) ---------- */
.quick-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 20px; margin-bottom:22px;}
.quick-tile{
  display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
  border:1px solid var(--border); border-radius:16px; background:var(--white); padding:16px 6px;
  box-shadow:var(--shadow-soft); transition:transform .15s ease;
}
.quick-tile:active{transform:scale(0.95);}
.quick-tile .sym{
  width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
  border:1px solid var(--border-soft);
}
.quick-tile.solve .sym{background:rgba(76,125,255,.16); color:#8CACFF;}
.quick-tile.challenge .sym{background:rgba(255,92,122,.14); color:var(--coral);}
.quick-tile.tabuada .sym{background:rgba(178,63,224,.16); color:#D291F2;}
.quick-tile .label{font-size:12px; font-weight:700; color:var(--ink); font-family:'Fraunces',serif; line-height:1.25;}

.tile-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  padding:0 20px;
}
.tile{
  border:1px solid var(--border); border-radius:var(--radius-card);
  background:var(--white); padding:18px 16px;
  display:flex; flex-direction:column; gap:28px;
  text-align:left;
  box-shadow:var(--shadow-soft);
  transition:transform .15s ease, border-color .15s ease;
}
.tile:active{transform:scale(0.97); border-color:var(--border);}
.tile .sym{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border-soft);
}
.tile .label{font-weight:700; font-size:14.5px; color:var(--ink); font-family:'Fraunces',serif;}
.tile .sub{font-size:12px; color:var(--ink-soft); margin-top:-22px;}
.tile.learn .sym{background:rgba(51,210,227,.14); color:var(--pine);}
.tile.exercises .sym{background:rgba(255,92,122,.14); color:var(--coral);}
.tile.calc .sym{background:rgba(178,63,224,.16); color:#D291F2;}
.tile.progress .sym{background:rgba(76,125,255,.16); color:#8CACFF;}

/* ---------- lists / cards ---------- */
.card{
  background:var(--white); border:1px solid var(--border); border-radius:var(--radius-card);
  padding:16px; margin-bottom:12px; box-shadow:var(--shadow-soft);
}
.subject-row{
  display:flex; align-items:center; gap:13px;
  background:var(--white); border:1px solid var(--border); border-radius:16px;
  padding:14px 15px; margin-bottom:10px;
  box-shadow:var(--shadow-soft);
  transition:transform .15s ease, border-color .15s ease;
}
.subject-row .sym{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
  width:40px;height:40px;border-radius:11px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(76,125,255,.16); color:#8CACFF; border:1px solid var(--border-soft);
}
.subject-row .txt{flex:1; min-width:0;}
.subject-row .txt .name{font-weight:700; font-size:14.5px; color:var(--ink); font-family:'Fraunces',serif;}
.subject-row .txt .desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.subject-row .chev{font-size:18px; color:var(--ink-soft); flex-shrink:0;}
.subject-row:active{transform:scale(0.98);}
.subject-row.mastered{border-color:rgba(51,210,227,.35);}
.subject-row .mastered-badge{
  font-size:10px; font-weight:700; color:var(--pine); letter-spacing:.03em;
  background:rgba(51,210,227,.14); padding:4px 8px; border-radius:6px; flex-shrink:0;
}

section.block{margin-bottom:22px;}
section.block h3{font-size:12.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:10px; font-family:'Inter',sans-serif; letter-spacing:.08em;}

/* ---------- subject detail (learn) ---------- */
.learn-hero{
  background:linear-gradient(155deg, #1B1E3B, #0F0E1B); color:var(--ink);
  border:1px solid var(--border);
  border-radius:var(--radius-hero); padding:22px; margin-bottom:16px;
  position:relative; overflow:hidden; box-shadow:var(--shadow-ink);
}
.learn-hero .sym-big{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:32px; color:#8CACFF;
}
.learn-hero h2{color:var(--ink); font-size:22px; margin-top:8px;}
.explain-card{
  border:1px solid var(--border); border-radius:var(--radius-card); background:var(--white);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow-soft);
}
.explain-card p{font-size:14.5px; line-height:1.65; margin:0 0 10px; color:var(--ink);}
.explain-card p:last-child{margin-bottom:0;}
.explain-card .section-title{font-size:11.5px; font-weight:700; color:var(--pine); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 6px;}
.explain-card .section-title:first-child{margin-top:0;}
.example-box{
  background:rgba(51,210,227,.1); border:1px solid rgba(51,210,227,.2); border-radius:13px; padding:13px 15px; margin-top:8px;
  text-align:center;
}
.example-box .lbl{font-size:11px; font-weight:700; color:var(--pine); margin-bottom:5px; letter-spacing:.03em; text-transform:uppercase;}
.example-box .mono{font-size:15px; color:var(--ink);}
.example-steps{margin-top:11px; padding-top:10px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:9px;}
.ex-step{display:flex; width:100%; gap:10px; align-items:flex-start; text-align:left;}
.ex-step > .num{
  width:20px;height:20px;border-radius:50%; background:rgba(51,210,227,.14); border:1px solid rgba(51,210,227,.32);
  color:var(--pine); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
}
.ex-step .txt{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); word-break:break-word; line-height:1.5;}
/* dentro dos exemplos do Aprender, contas/visuais e passos um pouco menores */
.example-box .ex-step .txt{font-size:11.5px;}
.example-box .conta-armada{font-size:16px;}
.example-box .frac-row{font-size:15px;}
.example-box .chain-row{font-size:14.5px;}
.example-box .step-chain{font-size:13.5px;}
.example-box .eq-line{padding:5px 11px;}
.example-box .prop-table{font-size:13.5px;}
.example-box .sis-stack{font-size:13.5px;}
.example-box .divisao-chave{font-size:14px;}
.example-box .pot-item .pot-base{font-size:16px;}
.example-box .pot-item .pot-radical{font-size:16px;}
.cta-row{display:flex; gap:10px; margin-top:8px;}
.btn{
  border:1px solid var(--border); border-radius:var(--radius-chip);
  padding:12px 16px; font-weight:700; font-size:14px; text-align:center; flex:1;
  transition:transform .15s ease;
}
.btn.primary{background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#fff; border:none; box-shadow:0 8px 22px -8px rgba(120,80,240,.6);}
.btn.secondary{background:var(--white); color:var(--ink);}
.btn:active{transform:scale(0.97);}

/* ---------- difficulty chips ---------- */
.diff-row{display:flex; gap:9px; margin-bottom:18px;}
.diff-chip{
  flex:1; text-align:center; padding:13px 6px; border-radius:14px;
  border:1px solid var(--border); background:var(--white); font-weight:700; font-size:13.5px; color:var(--ink-soft);
  transition:transform .15s ease, border-color .15s ease, color .15s ease;
}
.diff-chip.active{background:rgba(76,125,255,.14); border-color:rgba(76,125,255,.35); color:#8CACFF;}
.diff-chip[data-d="facil"].active{background:rgba(51,210,227,.14); border-color:rgba(51,210,227,.35); color:var(--pine);}
.diff-chip[data-d="medio"].active{background:rgba(76,125,255,.14); border-color:rgba(76,125,255,.35); color:#8CACFF;}
.diff-chip[data-d="dificil"].active{background:rgba(255,92,122,.14); border-color:rgba(255,92,122,.35); color:var(--coral);}
.diff-chip:active{transform:scale(0.97);}

/* ---------- treino personalizado: seletor de assuntos e opções ---------- */
.link-btn{background:none;border:none;color:#8CACFF;font-weight:700;font-size:13px;cursor:pointer;padding:0;}
.subj-chip-grid{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 20px;}
.subj-chip{
  display:flex; align-items:center; gap:6px;
  padding:8px 13px 8px 8px; border-radius:20px; border:1px solid var(--border); background:var(--white);
  font-size:13px; font-weight:700; color:var(--ink-soft);
  transition:transform .15s ease, border-color .15s ease, color .15s ease, background .15s ease;
}
.subj-chip .sym{
  font-family:'JetBrains Mono',monospace; font-size:12px; width:21px; height:21px; border-radius:7px;
  background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.subj-chip.active{background:rgba(76,125,255,.14); border-color:rgba(76,125,255,.35); color:#8CACFF;}
.subj-chip.active .sym{background:rgba(76,125,255,.22); color:#8CACFF;}
.subj-chip:active{transform:scale(0.96);}
.weak-toggle{
  display:flex; align-items:center; gap:11px; width:100%;
  border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:18px;
  background:var(--white); text-align:left; font-size:13.5px; font-weight:700; color:var(--ink-soft);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.weak-toggle .check{
  width:20px; height:20px; border-radius:6px; border:1px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.weak-toggle.active{border-color:rgba(51,210,227,.35); color:var(--pine); background:rgba(51,210,227,.08);}
.weak-toggle.active .check{background:var(--pine); border-color:var(--pine); color:#0F0E1B;}
.weak-toggle:active{transform:scale(0.99);}

/* ---------- exercise session ---------- */
.progress-dots{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.progress-dots .dot{width:8px;height:8px;border-radius:50%; background:var(--surface-2); border:1px solid var(--border);}
.progress-dots .dot.ok{background:var(--pine); border-color:var(--pine);}
.progress-dots .dot.bad{background:var(--coral); border-color:var(--coral);}
.progress-dots .dot.now{background:var(--amber); border-color:var(--amber);}

.question-card{
  border:1px solid var(--border); border-radius:var(--radius-hero); background:var(--white);
  padding:22px; margin-bottom:14px; box-shadow:var(--shadow-ink);
}
.question-card .qlabel{font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:9px; letter-spacing:.05em; text-transform:uppercase;}
.question-card .qtext{font-size:19px; line-height:1.55; font-family:'Fraunces',serif; color:var(--ink);}
.answer-form{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.answer-form .pair-row{display:flex; gap:10px;}
.answer-form label{font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; display:block;}
.answer-form input{
  width:100%; border:1px solid var(--border); border-radius:12px; padding:13px 14px;
  font-size:16px; background:var(--surface-2); color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:600;
}
.answer-form input:focus{outline:none; border-color:var(--amber);}
.ans-input-wrap{position:relative;}
.ans-input-wrap input{padding-right:44px;}
.slash-btn{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
  background:var(--white); color:var(--pine); font-weight:700; font-size:16px;
  display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace;
}
.slash-btn:active{transform:translateY(-50%) scale(0.9);}
.check-btn{
  margin-top:6px; border:none; background:linear-gradient(135deg, var(--amber), var(--amber-deep)); border-radius:var(--radius-chip);
  padding:14px; font-weight:700; font-size:15px; color:#fff;
  box-shadow:0 8px 22px -8px rgba(120,80,240,.6);
  transition:transform .15s ease;
}
.check-btn:active{transform:scale(0.98);}
.check-btn:disabled{opacity:.4; box-shadow:none;}

/* ---------- dica (Fase 2) ---------- */
.hint-btn{
  display:block; width:100%; text-align:center; background:none; border:1px dashed var(--border);
  border-radius:12px; padding:10px; margin:2px 0 12px; font-size:13px; font-weight:700; color:#8CACFF;
}
.hint-btn:active{transform:scale(0.98);}
.hint-box{
  background:rgba(76,125,255,.08); border:1px solid rgba(76,125,255,.25); border-radius:14px;
  padding:12px 14px; margin:-4px 0 14px; font-size:13.5px; color:var(--ink-soft); line-height:1.55;
}

.feedback{
  margin-top:16px; padding:16px 17px; border-radius:16px; border:1px solid var(--border);
}
.feedback.correct{background:rgba(51,210,227,.1); border-color:rgba(51,210,227,.25);}
.feedback.wrong{background:rgba(255,92,122,.1); border-color:rgba(255,92,122,.25);}
.feedback .fb-title{font-weight:700; font-size:15px; margin-bottom:7px; font-family:'Fraunces',serif;}
.feedback.correct .fb-title{color:var(--pine);}
.feedback.wrong .fb-title{color:var(--coral-deep, #FF5C7A);}
.feedback .fb-explain{font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
.feedback .fb-explain .step{margin:4px 0;}
.next-btn{
  margin-top:14px; width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:var(--radius-chip); padding:14px; font-weight:700; font-size:14.5px;
  transition:transform .15s ease;
}
.next-btn:active{transform:scale(0.98);}
.drill-btn{
  margin-top:14px; width:100%; border:1px solid rgba(255,92,122,.3); background:rgba(255,92,122,.08); color:var(--coral-deep, #FF5C7A);
  border-radius:var(--radius-chip); padding:13px; font-weight:700; font-size:13.5px;
  transition:transform .15s ease;
}
.drill-btn:active{transform:scale(0.98);}

.session-end{
  border:1px solid var(--border); border-radius:var(--radius-hero); background:linear-gradient(155deg, #1B1E3B, #0F0E1B); color:var(--ink);
  padding:30px 24px; text-align:center; box-shadow:var(--shadow-ink);
}
.session-end .big-num{font-family:'Fraunces',serif; font-size:46px; color:#8CACFF; font-weight:600;}
.session-end p{color:var(--ink-soft); font-size:14px; margin:8px 0 20px;}

/* ---------- solve screen ---------- */
.solve-input-card{
  border:1px solid var(--border); border-radius:var(--radius-hero); background:var(--white);
  padding:20px; margin-bottom:16px; box-shadow:var(--shadow-ink);
}
.solve-input-card textarea{
  width:100%; min-height:80px; border:1px solid var(--border); border-radius:13px;
  padding:13px 14px; font-size:16px; font-family:'JetBrains Mono',monospace; resize:none;
  background:var(--surface-2); color:var(--ink);
}
.solve-input-card textarea:focus{outline:none; border-color:var(--amber);}
.solve-examples{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.ex-chip{
  font-family:'JetBrains Mono',monospace; font-size:12px; padding:7px 11px; border-radius:10px;
  background:rgba(51,210,227,.1); color:var(--pine); border:1px solid rgba(51,210,227,.22);
}
.solve-btn{
  width:100%; margin-top:16px; border:none; background:linear-gradient(135deg, var(--amber), var(--amber-deep));
  border-radius:var(--radius-chip); padding:14px; font-weight:700; font-size:15px; color:#fff;
  box-shadow:0 8px 22px -8px rgba(120,80,240,.6);
  transition:transform .15s ease;
}
.solve-btn:active{transform:scale(0.98);}

.result-section{margin-bottom:14px;}
.result-section .sec-label{
  font-size:11.5px; font-weight:700; color:var(--pine); text-transform:uppercase; letter-spacing:.05em;
  display:flex; align-items:center; gap:8px; margin-bottom:9px;
}
.result-section .sec-label .n{
  width:20px;height:20px;border-radius:50%; background:rgba(51,210,227,.16); color:var(--pine);
  display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:1px solid rgba(51,210,227,.32);
}
.result-card{
  border:1px solid var(--border); border-radius:15px; background:var(--white); padding:15px 17px; box-shadow:var(--shadow-soft);
}
.result-card p{margin:0; font-size:14px; line-height:1.65; color:var(--ink-soft);}
.solve-visual{display:flex; flex-direction:column; align-items:center; padding-bottom:14px; margin-bottom:10px; border-bottom:1px solid var(--border-soft);}
.step-item{
  display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border-soft);
}
.step-item:last-child{border-bottom:none;}
.step-item > .num{
  width:22px;height:22px;border-radius:50%; background:rgba(51,210,227,.14); border:1px solid rgba(51,210,227,.32);
  color:var(--pine); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
}
.step-item .txt{font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--ink); word-break:break-word;}
.final-answer-box{
  background:linear-gradient(155deg, #1B1E3B, #0F0E1B); color:var(--ink); border-radius:15px; padding:18px;
  text-align:center; border:1px solid var(--border);
}
.final-answer-box .lbl{font-size:11px; opacity:.65; font-weight:700; margin-bottom:5px; letter-spacing:.05em; text-transform:uppercase;}
.final-answer-box .val{font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:700; color:#8CACFF;}

/* ---------------- conta armada (unidade sob unidade, dezena sob dezena) ---------------- */
.conta-armada{
  display:inline-flex; flex-direction:column; align-items:flex-end;
  font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:600;
  margin:6px 0;
}
.ca-row{display:flex; justify-content:flex-end;}
.ca-cell{
  min-width:17px; text-align:center; padding:2px 0; color:var(--ink);
}
.ca-sign{color:var(--pine); font-weight:700; min-width:15px;}
.ca-comma{min-width:7px; font-weight:700; color:var(--ink);}
.ca-line{align-self:stretch; border-top:2px solid var(--ink-soft); margin:3px 0 4px;}
.ca-result .ca-cell{color:#8CACFF; font-weight:700;}
.ca-carry-row{margin-bottom:-3px;}
.ca-carry-row .ca-cell{font-size:11.5px; font-weight:700; color:var(--pine); min-height:15px; padding:0;}
.ca-carry-row .ca-sign{min-width:15px;}
.ca-borrow-mark{color:var(--coral) !important;}
.ca-strike{position:relative; opacity:.5;}
.ca-strike::after{content:''; position:absolute; left:1px; right:1px; top:50%; border-top:2px solid var(--coral); transform:rotate(-8deg);}
.ca-caption{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:2px;}
.ca-multistep-note{display:flex; align-items:center; gap:7px; justify-content:center; background:rgba(51,210,227,.12); border:1px solid rgba(51,210,227,.35); border-radius:10px; padding:9px 14px; margin-bottom:12px; font-size:13px; font-weight:700; color:var(--pine); text-align:center; line-height:1.4;}
.question-card .qtext.stacked{text-align:center;}

/* ---------------- fração visual: numerador sobre denominador ---------------- */
.frac-row{display:inline-flex; align-items:center; flex-wrap:wrap; gap:2px; font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600;}
.frac-item{display:inline-flex; flex-direction:column; align-items:stretch; margin:0 5px; text-align:center;}
.frac-item .num{padding:0 4px 3px; white-space:nowrap;}
.frac-item .den{padding:3px 4px 0; white-space:nowrap;}
.frac-item .bar{border-top:2px solid var(--ink-soft); margin:0 1px;}
.frac-op{color:var(--pine); font-weight:700; margin:0 3px;}
.question-card .qtext.stacked .frac-row{justify-content:center;}

/* ---------------- mmc: múltiplos de cada denominador + a fração que ele vira, lado a lado ---------------- */
.mmc-block{margin:16px 0; text-align:center;}
.mmc-cols{display:flex; gap:8px; justify-content:center; margin:4px 0 10px;}
.mmc-col{display:flex; flex-direction:column; align-items:center; flex:1; max-width:150px; padding:0 14px;}
.mmc-col:first-child{border-right:1px solid var(--border-soft);}
.mmc-col-label{font-size:10.5px; line-height:1.3; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
.mmc-chips{display:flex; flex-direction:column; align-items:center; gap:7px;}
.mmc-chip{padding:4px 12px; border-radius:7px; background:var(--surface-2); color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13.5px; min-width:20px; text-align:center;}
.mmc-chip.hit{background:rgba(51,210,227,.18); color:var(--pine); border:1px solid rgba(51,210,227,.4); font-weight:700;}
.mmc-chip.ghost{visibility:hidden;}
.mmc-col-arrow{color:var(--ink-soft); font-size:13px; margin:8px 0; line-height:1;}
.mmc-col-frac{margin-top:2px;}
.mmc-col-frac .frac-row{font-size:13.5px;}
.mmc-col-frac .frac-item{margin:0 3px;}
.mmc-result{margin-top:4px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#8CACFF; font-weight:700; text-align:center;}

/* ---------------- fatoração em coluna: escadinha de divisão por primos até achar o MMC ---------------- */
.fat-table{display:inline-flex; flex-direction:column; font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; margin:8px 0 4px;}
.fat-row{display:flex; align-items:center;}
.fat-nums{display:flex; gap:16px; padding:4px 14px 4px 2px; border-right:2px solid var(--ink); min-width:60px; justify-content:flex-end;}
.fat-num{min-width:20px; text-align:center; color:var(--ink);}
.fat-num.same{color:var(--ink-soft); opacity:.55;}
.fat-div{padding:4px 4px 4px 14px; color:var(--pine); font-weight:700; min-width:22px;}
.fat-mult{margin-top:6px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft);}

/* ---------------- fatoração em coluna (estilo "quadro de aula", vários números de uma vez) ---------------- */
.mfat-table{display:inline-flex; font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600; margin:8px 0;}
.mfat-nums-col{display:flex; flex-direction:column; border-right:2px solid var(--pine); padding-right:16px; margin-right:16px;}
.mfat-nums-row{display:flex; gap:16px; padding:4px 0; justify-content:flex-end;}
.mfat-num{min-width:16px; text-align:center; color:var(--ink);}
.mfat-primes-col{display:flex; flex-direction:column;}
.mfat-primes-row{padding:4px 0; min-width:34px;}
.mfat-prime{color:var(--pine); font-weight:700;}
.mfat-primes-row.mfat-final-row{border-top:2px solid var(--pine); padding-top:6px; margin-top:2px;}
.mfat-result{color:#8CACFF; font-weight:700;}

/* ---------------- equação de frações + resultado (numeradores em cadeia sobre o MMC) ---------------- */
.frac-mmc-block{margin:8px 0;}
.frac-mmc-eq{display:flex; align-items:center; flex-wrap:wrap; gap:4px; justify-content:center;}
.mmc-final-frac{display:inline-flex; flex-direction:column; align-items:center; font-family:'JetBrains Mono',monospace; font-weight:700; margin-left:6px;}
.mmc-final-frac .num-chain{padding:0 8px 4px; border-bottom:2.5px solid var(--ink); font-size:15px; white-space:nowrap; color:var(--ink);}
.mmc-final-frac .den-val{padding-top:4px; font-size:15px; color:#8CACFF;}
.frac-mmc-link{font-size:11px; color:var(--ink-soft); text-align:center; margin:12px 0 8px;}

/* ---------------- cadeia de termos (potenciação, expressões) ---------------- */
.chain-row{display:inline-flex; align-items:center; flex-wrap:wrap; gap:2px; font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;}
.chain-val{padding:2px 5px;}
.chain-op{color:var(--pine); font-weight:700; padding:0 4px;}
.question-card .qtext.stacked .chain-row{justify-content:center;}

/* ---------------- escada de passos (equações, funções) ---------------- */
.step-chain{display:flex; flex-direction:column; align-items:center; gap:3px; margin:8px 0; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}
.eq-line{padding:6px 14px; background:var(--surface-2); border-radius:10px; color:var(--ink); text-align:center;}
.eq-arrow{color:var(--ink-soft); font-size:13px; line-height:1;}
.question-card .qtext.stacked .step-chain{align-items:center;}
.question-card .qtext.stacked .eq-line{text-align:center;}

/* ---------------- tabela de proporção (regra de três) ---------------- */
.prop-table{display:inline-grid; grid-template-columns:auto auto; gap:5px 12px; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; margin:8px 0; align-items:center;}
.prop-cell{padding:5px 12px; background:var(--surface-2); border-radius:9px; text-align:center; min-width:44px;}
.prop-cell.prop-head{background:transparent; color:var(--ink-soft); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:0 12px;}
.prop-cell.unknown{background:rgba(76,125,255,.18); color:#8CACFF; border:1px dashed rgba(76,125,255,.45);}
.prop-tag{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:11.5px; font-weight:700; margin-bottom:10px;}
.prop-tag.direta{background:rgba(51,210,227,.14); color:var(--pine); border:1px solid rgba(51,210,227,.35);}
.prop-tag.inversa{background:rgba(76,125,255,.14); color:var(--amber); border:1px solid rgba(76,125,255,.35);}

/* ---------------- multiplicação em cruz (regra de três direta) ---------------- */
.cruz-box{position:relative; width:220px; margin:10px auto; font-family:'JetBrains Mono',monospace; font-weight:700;}
.cruz-box .ch-heads{display:flex; justify-content:space-between; margin-bottom:6px;}
.cruz-box .ch-head{width:70px; text-align:center; color:var(--ink-soft); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.cruz-box .ch-data{position:relative; height:104px;}
.cruz-box .ch-cell{position:absolute; width:70px; padding:6px 0; background:var(--surface-2); border-radius:9px; text-align:center; font-size:16px;}
.cruz-box .ch-cell.tl{top:0; left:0;}
.cruz-box .ch-cell.tr{top:0; right:0;}
.cruz-box .ch-cell.bl{bottom:0; left:0;}
.cruz-box .ch-cell.br{bottom:0; right:0;}
.cruz-box .ch-cell.unknown{background:rgba(76,125,255,.18); color:#8CACFF; border:1px dashed rgba(76,125,255,.45);}
.cruz-box svg{position:absolute; top:0; left:0; width:100%; height:104px; overflow:visible; pointer-events:none;}
.cruz-box svg line{stroke:var(--coral); stroke-width:2.5;}

/* ---------------- cartão de resolução estilo "caderno": Δ e S destacados em caixas ---------------- */
.bhaskara-card{background:var(--surface-2); border-radius:var(--radius-card); padding:14px 18px; margin:10px 0; font-family:'JetBrains Mono',monospace; font-size:14px; line-height:1.9;}
.bk-formula-box{margin:4px 0 14px;}
.bk-divider{text-align:center; color:var(--ink-soft); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:6px 0 10px;}
.bk-formula-row{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; font-family:'JetBrains Mono',monospace; font-size:15px;}
.bk-formula-sep{color:var(--ink-soft); font-size:12px; margin:8px 0 6px; text-align:center;}
.bhaskara-card .bk-row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:3px 0;}
.bhaskara-card .bk-badge{display:inline-block; padding:2px 10px; border:1.5px solid var(--coral); color:var(--coral); border-radius:8px; font-weight:700; font-size:13px; margin-left:auto;}
.bhaskara-card .bk-roots{display:flex; flex-wrap:wrap; justify-content:center; gap:22px; margin:8px 0;}
.bhaskara-card .bk-root-item{display:flex; align-items:center; gap:6px; font-weight:600;}
.bhaskara-card .bk-final{text-align:center; margin-top:10px;}
.bhaskara-card .bk-badge-final{font-size:16px; padding:6px 18px;}

/* ---------------- mini-gráfico de reta (função do 1º grau: crescente / decrescente) ---------------- */
.lin-graph-wrap{display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin:10px 0;}
.lin-graph{width:210px; text-align:center;}
.lin-graph-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
.lin-graph-svg{width:100%; height:auto; overflow:visible;}
.lg-axis{stroke:var(--ink-soft); stroke-width:1.5;}
.lg-line{stroke-width:3; fill:none; stroke-linecap:round;}
.lg-dot{stroke:var(--pine-deep); stroke-width:1.5;}
.lg-dot-b{fill:var(--amber);}
.lg-dot-raiz{fill:var(--coral);}
.lg-text{font-size:10.5px; font-family:'JetBrains Mono',monospace; font-weight:700;}
.lg-text-b{fill:var(--amber);}
.lg-text-raiz{fill:var(--coral);}

/* ---------------- sistema empilhado (equações alinhadas por termo) ---------------- */
.sis-stack{display:inline-flex; flex-direction:column; align-items:flex-end; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; margin:8px 0;}
.sis-row{display:flex; justify-content:flex-end; gap:5px;}
.sis-term{min-width:52px; text-align:right; padding:2px 0;}
.sis-eq{color:var(--pine); font-weight:700; padding:0 2px;}
.sis-line{align-self:stretch; border-top:2px solid var(--ink-soft); margin:3px 0 4px;}

/* ---------------- divisão pela chave (método clássico) ---------------- */
.divisao-chave{display:inline-flex; align-items:flex-start; font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600; margin:6px 0;}
.dc-left{display:flex; flex-direction:column; align-items:flex-start; padding-right:10px; border-right:2.5px solid var(--ink); min-width:38px;}
.dc-row{padding:2px 0; display:flex;}
.dc-cell{min-width:15px; text-align:center; display:inline-block;}
.dc-sign{color:var(--pine); min-width:13px;}
.dc-row.dc-sub{color:var(--coral);}
.dc-row.dc-sub .dc-sign{color:var(--coral);}
.dc-row.dc-final{color:#8CACFF; font-weight:700; border-top:2px solid var(--ink-soft); margin-top:1px; padding-top:4px; align-self:stretch;}
.dc-line{align-self:stretch; border-top:2px solid var(--ink-soft); margin:1px 0 3px;}
.dc-right{display:flex; flex-direction:column; padding-left:12px; min-width:44px;}
.dc-divisor{padding:2px 2px;}
.dc-bracket-line{border-top:2.5px solid var(--ink); margin:2px 0 6px;}
.dc-quotient{padding:2px 2px; color:#8CACFF; font-weight:700; font-size:19px;}

/* ---------------- potência e raiz: expoente sobrescrito, radical com barra ---------------- */
.pot-item{display:inline-flex; align-items:flex-start; margin:0 6px;}
.pot-item .pot-base{font-size:19px;}
.pot-item .pot-exp{font-size:12px; color:var(--pine); font-weight:700; margin:-2px 0 0 1px;}
.pot-item.root{align-items:flex-end;}
.pot-item .pot-index{font-size:11px; color:var(--pine); font-weight:700; margin:0 1px 7px 0;}
.pot-item .pot-radical{font-size:19px;}
.pot-item .pot-under{border-top:2px solid var(--ink); padding:0 4px 1px 3px; margin-top:1px;}
.pot-stage{margin:4px 0;}

.unrecognized{
  border:1px dashed var(--border); border-radius:15px; padding:20px; text-align:center; color:var(--ink-soft); font-size:14px;
}

/* ---------- calculator ---------- */
.calc-display{
  border:1px solid var(--border); border-radius:var(--radius-hero); background:linear-gradient(155deg, #1B1E3B, #0F0E1B);
  padding:26px 22px; margin-bottom:18px; text-align:right; box-shadow:var(--shadow-ink);
}
.calc-display .prev{color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:15px; min-height:19px; word-break:break-all;}
.calc-display .cur{color:#8CACFF; font-family:'JetBrains Mono',monospace; font-size:38px; font-weight:700; word-break:break-all;}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.calc-key{
  border:1px solid var(--border); border-radius:15px; background:var(--white);
  padding:17px 0; font-size:18px; font-weight:600; font-family:'JetBrains Mono',monospace; color:var(--ink);
  box-shadow:var(--shadow-soft);
  transition:transform .15s ease;
}
.calc-key:active{transform:scale(0.95);}
.calc-key.op{background:rgba(51,210,227,.12); color:var(--pine); border-color:rgba(51,210,227,.24);}
.calc-key.fn{background:var(--surface-2); color:var(--ink-soft); font-size:14px;}
.calc-key.eq{background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#fff; border:none; box-shadow:0 8px 22px -8px rgba(120,80,240,.6);}
.calc-key.sci{background:var(--surface-2); color:var(--ink); font-size:13.5px; padding:13px 0;}
.calc-key.sci.active-mode{background:rgba(51,210,227,.14); color:var(--pine); border-color:rgba(51,210,227,.35);}
.calc-toggle-row{display:flex; gap:9px; margin-bottom:12px;}
.calc-toggle-chip{
  flex:1; text-align:center; padding:11px 6px; border-radius:14px; border:1px solid var(--border);
  background:var(--white); font-weight:700; font-size:13px; color:var(--ink-soft); transition:transform .15s ease;
}
.calc-toggle-chip:active{transform:scale(0.97);}
.calc-toggle-chip.active{background:rgba(51,210,227,.14); border-color:rgba(51,210,227,.35); color:var(--pine);}
.calc-sci-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;}

/* ---------- progress ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
.stat-card{
  border:1px solid var(--border); border-radius:17px; padding:17px 15px; background:var(--white); box-shadow:var(--shadow-soft);
}
.stat-card .num{font-family:'Fraunces',serif; font-size:30px; color:var(--ink); font-weight:600;}
.stat-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:3px;}
.stat-card.acc{background:linear-gradient(155deg, #1B1E3B, #0F0E1B);}
.stat-card.acc .num{color:#8CACFF;}
.stat-card.acc .lbl{color:var(--ink-soft); opacity:1;}

.mastery-row{
  border:1px solid var(--border); border-radius:15px; padding:14px 15px; margin-bottom:9px; background:var(--white); box-shadow:var(--shadow-soft);
}
.mastery-row .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;}
.mastery-row .name{font-weight:700; font-size:13.5px; color:var(--ink); font-family:'Fraunces',serif;}
.mastery-row .pct{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--ink-soft);}
.bar-track{height:7px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--pine), #7FEAF2); border-radius:5px;}
.bar-fill.mid{background:linear-gradient(90deg, var(--amber), #8CACFF);}
.bar-fill.low{background:linear-gradient(90deg, #C23F58, var(--coral));}
.empty-note{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:22px 10px;}

.history-list{display:flex; flex-direction:column;}
.history-row{
  display:flex; gap:11px; align-items:flex-start;
  border:1px solid var(--border); border-radius:15px; padding:13px 14px; margin-bottom:9px; background:var(--white); box-shadow:var(--shadow-soft);
}
.history-icon{
  width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; margin-top:1px;
}
.history-row.ok .history-icon{background:rgba(51,210,227,.16); color:var(--pine);}
.history-row.bad .history-icon{background:rgba(255,92,122,.14); color:var(--coral-deep, #FF5C7A);}
.history-info{flex:1; min-width:0;}
.history-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px;}
.history-top .subj{font-weight:700; font-size:13.5px; color:var(--ink); font-family:'Fraunces',serif;}
.history-top .diff{font-size:10.5px; font-weight:700; color:var(--ink-soft); border:1px solid var(--border-soft); border-radius:20px; padding:1px 8px; text-transform:uppercase; letter-spacing:.02em;}
.history-q{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:3px; word-break:break-word;}
.history-date{font-size:11.5px; color:var(--ink-soft); opacity:.75;}

/* ---------- tabuada pitagórica ---------- */
.tabuada-block{padding:0 20px; margin-bottom:22px;}
.tabuada-card{padding:16px 14px;}
.tabuada-chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch;}
.tabuada-chip{
  flex-shrink:0; width:34px; height:34px; border-radius:10px; border:1px solid var(--border-soft);
  background:var(--surface-2); color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
  transition:transform .15s ease;
}
.tabuada-chip:active{transform:scale(0.92);}
.tabuada-chip.active{
  background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#fff; border-color:transparent;
}
.tabuada-list{display:flex; flex-direction:column; gap:6px;}
.tabuada-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 12px; border-radius:10px; background:var(--surface-2);
  font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--ink);
}
.tabuada-row .eq{color:var(--ink-soft); margin:0 6px;}
.tabuada-row .res{font-weight:700; color:var(--pine);}

.footer-note{text-align:center; font-size:11.5px; color:var(--ink-soft); padding:18px 20px 4px;}

/* ---------- login / cadastro ---------- */
.auth-wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-hero);padding:30px 24px;box-shadow:var(--shadow-ink);}
.auth-logo{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;filter:drop-shadow(0 10px 24px rgba(76,125,255,.45));}
.auth-logo img{width:100%;height:100%;display:block;object-fit:contain;}
.auth-brand{text-align:center;font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;margin-bottom:4px;}
.auth-card h2{text-align:center;font-size:22px;}
.auth-card .sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:7px 0 22px;line-height:1.55;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.auth-field input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--surface-2);color:var(--ink);}
.auth-field input:focus{outline:none;border-color:var(--amber);}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:46px;}
.pass-toggle{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border:none; background:transparent;
  font-size:17px; display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); border-radius:8px;
}
.pass-toggle:active{transform:translateY(-50%) scale(0.92);}
.auth-btn{width:100%;border:none;background:linear-gradient(135deg, var(--amber), var(--amber-deep));color:#fff;padding:14px;border-radius:var(--radius-chip);font-weight:700;font-size:15px;margin-top:6px;box-shadow:0 8px 22px -8px rgba(120,80,240,.6);transition:transform .15s ease;}
.auth-btn:active{transform:scale(0.98);}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft);}
.auth-switch button{background:none;border:none;color:#8CACFF;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;padding:0;}
.auth-error{background:rgba(255,92,122,.12);color:var(--coral);border:1px solid rgba(255,92,122,.25);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:14px;text-align:center;}
.auth-logout{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:14px;margin-left:auto;flex-shrink:0;box-shadow:var(--shadow-soft);}
.auth-logout:active{transform:scale(0.94);}

/* ---------- profile ---------- */
.profile-card{text-align:center; padding:12px 0 8px;}
.profile-avatar{
  width:84px; height:84px; border-radius:50%; margin:0 auto 14px;
  background:linear-gradient(135deg, var(--amber), var(--amber-deep));
  display:flex; align-items:center; justify-content:center;
  font-size:34px; font-weight:700; color:#fff; font-family:'Fraunces',serif;
  box-shadow:0 8px 22px -8px rgba(120,80,240,.6);
}
.profile-name{font-size:20px; font-weight:700; color:var(--ink); font-family:'Fraunces',serif;}
.profile-sub{font-size:13px; color:var(--ink-soft); margin-top:4px;}
.profile-btn-avatar{background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#fff; font-weight:700; font-size:15px; border:none; font-family:'Fraunces',serif;}

/* ---------- barra de navegação inferior ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:480px;
  display:flex; align-items:stretch; justify-content:space-around;
  background:rgba(12,13,26,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  z-index:80;
}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--ink-soft);
  padding:6px 2px 5px; border-radius:12px; transition:color .15s ease, background .15s ease, transform .15s ease;
}
.bn-item .bn-icon{
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  font-size:18px; line-height:1; font-weight:700;
}
.bn-item .bn-label{font-size:10.5px; font-weight:600; letter-spacing:.01em;}
.bn-item.active{color:#8CACFF;}
.bn-item.active .bn-icon{background:rgba(76,125,255,.16); border-radius:9px;}
.bn-item:active{transform:scale(0.93); background:var(--surface-2);}
</style>

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function simplifyFrac(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); return [n/g, d/g]; }
function fmt(n){
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return (Math.round(n*100)/100).toString().replace('.', ',');
}
function fracStr(n,d){ const [a,b]=simplifyFrac(n,d); return b===1? String(a) : (a+"/"+b); }

/* ---------------- MMC: lista os múltiplos de cada número lado a lado até achar o comum ---------------- */
// mostra o MMC dos denominadores junto com a fração equivalente que nasce de cada um —
// cada coluna reúne "múltiplos deste denominador" + "a fração que ele virou", lado a lado
// com a outra fração, pra ficar claro que cada lista pertence à fração ao seu lado.
function mmcFracVisual(n1, d1, n2, d2){
  const L = lcm(d1, d2);
  const f1 = L/d1, f2 = L/d2;
  const maxCount = Math.max(f1, f2);
  function col(n, d, f){
    let chips = '';
    // preenche o topo da coluna mais curta com espaços invisíveis, pra o número destacado
    // (o MMC) ficar na mesma altura nas duas colunas — mais fácil de comparar de relance.
    for(let p=0; p<maxCount-f; p++){ chips += `<div class="mmc-chip ghost"></div>`; }
    for(let i=1;i<=f;i++){
      chips += `<div class="mmc-chip${i===f?' hit':''}">${d*i}</div>`;
    }
    return `<div class="mmc-col">
      <div class="mmc-col-label">Múltiplos de ${d}</div>
      <div class="mmc-chips">${chips}</div>
      <div class="mmc-col-arrow">↓</div>
      <div class="mmc-col-frac">${fracRow([{n,d}, '×', {n:f,d:f}, '=', {n:n*f,d:L}])}</div>
    </div>`;
  }
  return `<div class="mmc-block">
    <div class="mmc-cols">${col(n1,d1,f1)}${col(n2,d2,f2)}</div>
    <div class="mmc-result">MMC(${d1}, ${d2}) = ${L}</div>
  </div>`;
}
// fatoração em coluna (método da "escadinha"): divide os dois números ao mesmo tempo pelo menor
// número primo que couber em pelo menos um deles. Quem não for divisível "repete" na linha de
// baixo. Termina quando os dois números da esquerda chegam a 1; o MMC é o produto de todos os
// primos usados na coluna da direita.
function fatoracaoColuna(a, b){
  function divides(n, d){ return n > 1 && n % d === 0; }
  let x = a, y = b, divisor = 2;
  const rows = [];
  while(x > 1 || y > 1){
    while(!divides(x, divisor) && !divides(y, divisor)){ divisor++; }
    const xDiv = divides(x, divisor), yDiv = divides(y, divisor);
    rows.push({x, y, divisor, xDiv, yDiv});
    x = xDiv ? x/divisor : x;
    y = yDiv ? y/divisor : y;
  }
  rows.push({x, y, divisor:null});
  const primes = rows.filter(r=>r.divisor).map(r=>r.divisor);
  const L = primes.reduce((p,c)=>p*c, 1);
  const rowsHtml = rows.map(r=>`
    <div class="fat-row">
      <div class="fat-nums">
        <span class="fat-num${r.divisor && !r.xDiv ? ' same':''}">${r.x}</span>
        <span class="fat-num${r.divisor && !r.yDiv ? ' same':''}">${r.y}</span>
      </div>
      <div class="fat-div">${r.divisor||''}</div>
    </div>`).join('');
  const html = `<div class="fat-table">${rowsHtml}</div>
    <div class="fat-mult">${primes.join(' × ')} = ${L}</div>
    <div class="mmc-result">MMC(${a}, ${b}) = ${L}</div>`;
  return {html, primes, L};
}
// depois de achar o MMC (por qualquer método), usa esse número pra mostrar em quê cada fração se
// transforma — lado a lado, pra ficar claro que o MMC vira o novo denominador das duas.
function fracTransformPair(n1, d1, n2, d2, L){
  const f1 = L/d1, f2 = L/d2;
  function col(n, d, f){
    return `<div class="mmc-col">
      <div class="mmc-col-label">${n}/${d} vira</div>
      <div class="mmc-col-frac">${fracRow([{n,d}, '×', {n:f,d:f}, '=', {n:n*f,d:L}])}</div>
    </div>`;
  }
  return `<div class="mmc-cols">${col(n1,d1,f1)}${col(n2,d2,f2)}</div>`;
}
// fatoração em coluna pra 2 OU MAIS números ao mesmo tempo (estilo "escadinha" clássico de sala de
// aula): divide todos os números pelo menor primo que couber em pelo menos um deles a cada linha;
// quem não for divisível "repete" (desce igual). Termina quando todos chegam a 1.
function mmcColuna(nums){
  function divides(n, d){ return n > 1 && n % d === 0; }
  let cur = nums.slice();
  const rows = [cur.slice()];
  const primes = [];
  let divisor = 2;
  while(cur.some(n=>n>1)){
    while(!cur.some(n=>divides(n,divisor))){ divisor++; }
    primes.push(divisor);
    cur = cur.map(n => divides(n,divisor) ? n/divisor : n);
    rows.push(cur.slice());
  }
  const L = primes.reduce((p,c)=>p*c, 1);
  const numsColHtml = rows.map(r=>
    `<div class="mfat-nums-row">${r.map(v=>`<span class="mfat-num">${v}</span>`).join('')}</div>`
  ).join('');
  const primesColHtml = rows.map((r,i)=>{
    const isFinal = i === rows.length-1;
    const content = isFinal
      ? `<span class="mfat-result">${L}</span>`
      : `<span class="mfat-prime">${i===0?'':'×'}${primes[i]}</span>`;
    return `<div class="mfat-primes-row${isFinal?' mfat-final-row':''}">${content}</div>`;
  }).join('');
  const html = `<div class="mfat-table"><div class="mfat-nums-col">${numsColHtml}</div><div class="mfat-primes-col">${primesColHtml}</div></div>`;
  return { html, primes, L };
}
// soma (ou subtrai) uma cadeia de 2+ frações com denominadores diferentes: mostra a equação
// original, o resultado (numeradores já transformados, em cima; o MMC, embaixo, como numa fração
// só), e a fatoração em coluna que achou esse MMC — igual ao método do quadro de aula.
// terms: [{n,d}, ...]. ops: sinais entre os termos ('+' ou '−'), tamanho terms.length-1.
function fracChainMMC(terms, ops){
  const denoms = terms.map(t=>t.d);
  const {html: mfatHtml, L} = mmcColuna(denoms);
  const factors = denoms.map(d => L/d);
  const newNums = terms.map((t,i)=> t.n*factors[i]);
  const chainParts = [];
  terms.forEach((t,i)=>{
    if(i>0) chainParts.push(ops[i-1]);
    chainParts.push({n:t.n, d:t.d});
  });
  chainParts.push('=');
  const eqHtml = fracRow(chainParts);
  let numChain = String(newNums[0]);
  for(let i=1;i<newNums.length;i++){ numChain += ` ${ops[i-1]} ${newNums[i]}`; }
  const finalFracHtml = `<div class="mmc-final-frac"><div class="num-chain">${numChain}</div><div class="den-val">${L}</div></div>`;
  return `<div class="frac-mmc-block">
    <div class="frac-mmc-eq">${eqHtml}${finalFracHtml}</div>
    <div class="frac-mmc-link">↓ de onde vem o ${L}? Veja o MMC calculado aqui embaixo:</div>
    ${mfatHtml}
  </div>`;
}
// mostra a divisão de simplificação só quando o resultado realmente pode ser simplificado —
// assim a explicação não fica pesada nos casos em que já está na forma mais simples.
function fracSimplifyStep(num, den){
  const g = gcd(num, den);
  if(g<=1) return [`Resultado: ${fracStr(num,den)}`];
  return [
    potStage(fracRow([{n:num,d:den}, '÷', {n:g,d:g}, '=', {n:num/g,d:den/g}])),
    `Simplificado: ${fracStr(num,den)}`
  ];
}

/* ---------------- conta armada: unidade sob unidade, dezena sob dezena ---------------- */
// nums: array de números/strings (operandos, de cima para baixo). op: '+', '−' ou '×'.
// result: string opcional do resultado, mostrado abaixo do traço.
/* ---------------- passo a passo real de contas armadas (com "vai um" / "empresta") ---------------- */
const PLACE_NAMES = ['unidades','dezenas','centenas','milhares','dezenas de milhar','centenas de milhar'];
const DECIMAL_NAMES = ['décimos','centésimos','milésimos'];
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function placeName(col, decimalPlaces){
  if(col < decimalPlaces){
    const idx = decimalPlaces - 1 - col; // idx 0 = décimos (casa mais à esquerda das decimais), 1 = centésimos, ...
    return DECIMAL_NAMES[idx] || `casa decimal ${idx+1}`;
  }
  const i = col - decimalPlaces;
  return PLACE_NAMES[i] || `casa ${i+1}`;
}
function toDigitsInt(n){ return String(Math.abs(Math.round(n))).split('').reverse().map(Number); }
function insertComma(numStr, decimals){
  if(decimals<=0) return numStr;
  let neg = numStr.startsWith('-'); if(neg) numStr = numStr.slice(1);
  while(numStr.length <= decimals) numStr = '0'+numStr;
  const ip = numStr.slice(0, numStr.length-decimals) || '0';
  const dp = numStr.slice(numStr.length-decimals);
  return (neg?'-':'') + ip + ',' + dp;
}
// soma coluna por coluna, com "vai um". nums: inteiros (já escalados se decimais). decimalPlaces: nº de casas decimais representadas.
function addColumnSteps(nums, decimalPlaces){
  decimalPlaces = decimalPlaces||0;
  const digitArrays = nums.map(toDigitsInt);
  const maxLen = Math.max(...digitArrays.map(d=>d.length));
  let carry = 0;
  const steps = [];
  const resultDigits = [];
  const carries = []; // carries[col] = "vai" recebido na coluna col (carries[0] sempre 0)
  for(let col=0; col<maxLen; col++){
    carries[col] = carry;
    const colDigits = digitArrays.map(d => d[col] || 0);
    const sum = colDigits.reduce((a,b)=>a+b,0) + carry;
    const digit = sum % 10;
    const newCarry = Math.floor(sum/10);
    const place = placeName(col, decimalPlaces);
    const terms = colDigits.join(' + ') + (carry ? ` + ${carry} (transporte)` : '');
    let line = `${cap1(place)}: ${terms} = ${sum}`;
    line += newCarry>0 ? ` → escreve ${digit}, vai ${newCarry}` : ` → escreve ${digit}`;
    steps.push(line);
    resultDigits.push(digit);
    carry = newCarry;
  }
  if(carry>0){ steps.push(`Sobrou ${carry} do transporte: escreve ${carry} na casa seguinte.`); resultDigits.push(carry); }
  const resultRaw = resultDigits.reverse().join('').replace(/^0+(?=\d)/,'');
  const result = insertComma(resultRaw, decimalPlaces);
  steps.push(`Resultado: ${result}`);
  return {steps, result, carries};
}
// subtrai a - b, coluna por coluna, com "empresta". a deve ser ≥ b.
function subColumnSteps(a, b, decimalPlaces){
  decimalPlaces = decimalPlaces||0;
  const da = toDigitsInt(a), db = toDigitsInt(b);
  const maxLen = Math.max(da.length, db.length);
  let borrow = 0;
  const steps = [];
  const resultDigits = [];
  const marks = []; // marks[col] = {type:'lend', value} (dígito riscado, mostra o valor reduzido) | {type:'receive'} (pequeno "1" — emprestou) | null
  for(let col=0; col<maxLen; col++){
    const borrowIn = borrow;
    const top0 = da[col]||0;
    const bottom = db[col]||0;
    const place = placeName(col, decimalPlaces);
    let top = top0 - borrowIn;
    let borrowOut, digit;
    if(top < bottom){
      digit = top+10-bottom;
      steps.push(`${cap1(place)}: ${top0}${borrowIn?` (já emprestou, ficou ${top})`:''} é menor que ${bottom} → empresta 1 da casa vizinha: ${top+10} − ${bottom} = ${digit}`);
      borrowOut = 1;
    } else {
      digit = top-bottom;
      steps.push(`${cap1(place)}: ${top} − ${bottom} = ${digit}`);
      borrowOut = 0;
    }
    if(borrowIn){ marks[col] = {type:'lend', value: top0 - borrowIn + 10*borrowOut}; }
    else if(borrowOut){ marks[col] = {type:'receive'}; }
    else { marks[col] = null; }
    resultDigits.push(digit);
    borrow = borrowOut;
  }
  const resultRaw = resultDigits.reverse().join('').replace(/^0+(?=\d)/,'') || '0';
  const result = insertComma(resultRaw, decimalPlaces);
  steps.push(`Resultado: ${result}`);
  return {steps, result, marks};
}
// multiplica a (inteiro) por m (dígito único 0-9), coluna por coluna, com "vai".
function mulSingleDigitSteps(a, m){
  const da = toDigitsInt(a);
  let carry = 0;
  const steps = [];
  const resultDigits = [];
  const carries = [];
  for(let col=0; col<da.length; col++){
    carries[col] = carry;
    const prod = da[col]*m + carry;
    const digit = prod % 10;
    const newCarry = Math.floor(prod/10);
    const place = placeName(col, 0);
    let line = `${cap1(place)} de ${a}: ${da[col]} × ${m}` + (carry? ` + ${carry} (transporte)`:'') + ` = ${prod}`;
    line += newCarry>0 ? ` → escreve ${digit}, vai ${newCarry}` : ` → escreve ${digit}`;
    steps.push(line);
    resultDigits.push(digit);
    carry = newCarry;
  }
  if(carry>0){ steps.push(`Sobrou ${carry} do transporte: escreve ${carry} na próxima casa.`); resultDigits.push(carry); }
  const result = resultDigits.reverse().join('').replace(/^0+(?=\d)/,'');
  steps.push(`Resultado: ${result}`);
  return {steps, result: Number(result), carries};
}
// multiplicação longa: a × b, com b de vários dígitos — produtos parciais deslocados e somados.
function mulLongSteps(a, b){
  const bDigits = String(b).split('').reverse();
  const steps = [];
  const partials = [];
  bDigits.forEach((chStr, i)=>{
    const d = Number(chStr);
    const partial = a*d*Math.pow(10,i);
    partials.push(partial);
    const label = i===0 ? `unidade de ${b} (${d})` : i===1 ? `dezena de ${b} (${d}, vale ${d*10})` : `${placeName(i,0)} de ${b} (${d}, vale ${d*Math.pow(10,i)})`;
    steps.push(`Multiplique ${a} pela ${label}: ${a} × ${d*Math.pow(10,i)} = ${partial}`);
  });
  steps.push(`Some os produtos parciais: ${partials.join(' + ')} = ${a*b}`);
  return {steps, partials, result: a*b};
}
// conta armada de multiplicação: opera armando a×b, com produtos parciais deslocados quando b tem 2+ dígitos.
function multArmada(a, b, solved, carries){
  function parse(v){
    let s = String(v).trim();
    let neg = s.startsWith('-') || s.startsWith('−');
    if(neg) s = s.slice(1);
    const [ip, dp] = s.split(',');
    return {neg, ip: ip || '0', dp: dp || ''};
  }
  const bDigits = String(b).split('');
  const multiDigit = bDigits.length > 1;
  const partials = multiDigit ? bDigits.slice().reverse().map((ch,i)=> a*Number(ch)*Math.pow(10,i)) : [];
  const result = a*b;
  const allValues = [a, b].concat(solved ? [result, ...partials] : []);
  const parsedAll = allValues.map(parse);
  const maxIp = Math.max(...parsedAll.map(p=>p.ip.length));
  function rowCells(p, sign){
    let out = `<span class="ca-cell ca-sign">${sign||''}</span>`;
    const ip = p.ip.padStart(maxIp, '\u00A0');
    for(const ch of ip) out += `<span class="ca-cell">${ch}</span>`;
    return out;
  }
  let rows = '';
  if(solved && !multiDigit && carries && carries.some(c=>c>0)){
    const ipChars = new Array(maxIp).fill('');
    for(let col=1; col<maxIp; col++){
      const val = carries[col];
      if(val) ipChars[maxIp-1-col] = String(val);
    }
    let carryRow = `<span class="ca-cell ca-sign">\u00A0</span>`;
    ipChars.forEach(ch=>{ carryRow += `<span class="ca-cell">${ch||'\u00A0'}</span>`; });
    rows += `<div class="ca-row ca-carry-row">${carryRow}</div>`;
  }
  rows += `<div class="ca-row">${rowCells(parse(a), '')}</div>`;
  rows += `<div class="ca-row">${rowCells(parse(b), '×')}</div>`;
  rows += `<div class="ca-line"></div>`;
  if(solved){
    if(multiDigit){
      partials.forEach(p=>{ rows += `<div class="ca-row">${rowCells(parse(p), '')}</div>`; });
      rows += `<div class="ca-line"></div>`;
    }
    rows += `<div class="ca-row ca-result">${rowCells(parse(result), '')}</div>`;
  }
  return `<div class="conta-armada">${rows}</div>`;
}

function contaArmada(nums, op, result, carries, topMarks){
  function parse(v){
    let s = String(v).trim();
    let neg = s.startsWith('-') || s.startsWith('−');
    if(neg) s = s.slice(1);
    const [ip, dp] = s.split(',');
    return {neg, ip: ip || '0', dp: dp || ''};
  }
  const parsedNums = nums.map(parse);
  const parsedResult = (result!=null && result!=='') ? parse(result) : null;
  const all = parsedResult ? parsedNums.concat([parsedResult]) : parsedNums;
  const maxIp = Math.max(...all.map(p=>p.ip.length));
  const maxDp = Math.max(...all.map(p=>p.dp.length));
  const hasDp = maxDp > 0;

  function rowCells(p, sign, strike){
    let out = `<span class="ca-cell ca-sign">${sign||''}</span>`;
    const ip = p.ip.padStart(maxIp, '\u00A0');
    [...ip].forEach((ch,idx)=>{
      out += `<span class="ca-cell${strike && strike.has('ip'+idx) ? ' ca-strike':''}">${ch}</span>`;
    });
    if(hasDp){
      out += `<span class="ca-cell ca-comma">${p.dp ? ',' : '\u00A0'}</span>`;
      const dp = p.dp.padEnd(maxDp, '\u00A0');
      [...dp].forEach((ch,idx)=>{
        out += `<span class="ca-cell${strike && strike.has('dp'+idx) ? ' ca-strike':''}">${ch}</span>`;
      });
    }
    return out;
  }

  let rows = '';
  if(carries && carries.some(c=>c>0)){
    const dpChars = new Array(maxDp).fill('');
    const ipChars = new Array(maxIp).fill('');
    for(let col=1; col<maxDp+maxIp; col++){
      const val = carries[col];
      if(!val) continue;
      if(col < maxDp) dpChars[maxDp-1-col] = String(val);
      else { const c2 = col-maxDp; if(c2 < maxIp) ipChars[maxIp-1-c2] = String(val); }
    }
    let carryRow = `<span class="ca-cell ca-sign">\u00A0</span>`;
    ipChars.forEach(ch=>{ carryRow += `<span class="ca-cell">${ch||'\u00A0'}</span>`; });
    if(hasDp){
      carryRow += `<span class="ca-cell ca-comma">\u00A0</span>`;
      dpChars.forEach(ch=>{ carryRow += `<span class="ca-cell">${ch||'\u00A0'}</span>`; });
    }
    rows += `<div class="ca-row ca-carry-row">${carryRow}</div>`;
  }
  let strikeSet = null;
  if(topMarks && topMarks.some(m=>m)){
    const dpAnn = new Array(maxDp).fill(null);
    const ipAnn = new Array(maxIp).fill(null);
    for(let col=0; col<maxDp+maxIp; col++){
      const m = topMarks[col];
      if(!m) continue;
      if(col < maxDp) dpAnn[maxDp-1-col] = m;
      else { const c2 = col-maxDp; if(c2 < maxIp) ipAnn[maxIp-1-c2] = m; }
    }
    strikeSet = new Set();
    let markRow = `<span class="ca-cell ca-sign">\u00A0</span>`;
    ipAnn.forEach((m,idx)=>{
      if(m && m.type==='lend'){ markRow += `<span class="ca-cell ca-borrow-mark">${m.value}</span>`; strikeSet.add('ip'+idx); }
      else if(m && m.type==='receive'){ markRow += `<span class="ca-cell ca-borrow-mark">1</span>`; }
      else markRow += `<span class="ca-cell">\u00A0</span>`;
    });
    if(hasDp){
      markRow += `<span class="ca-cell ca-comma">\u00A0</span>`;
      dpAnn.forEach((m,idx)=>{
        if(m && m.type==='lend'){ markRow += `<span class="ca-cell ca-borrow-mark">${m.value}</span>`; strikeSet.add('dp'+idx); }
        else if(m && m.type==='receive'){ markRow += `<span class="ca-cell ca-borrow-mark">1</span>`; }
        else markRow += `<span class="ca-cell">\u00A0</span>`;
      });
    }
    rows += `<div class="ca-row ca-carry-row">${markRow}</div>`;
  }
  rows += parsedNums.map((p,i)=>{
    const sign = p.neg ? '−' : (i===parsedNums.length-1 ? op : '');
    return `<div class="ca-row">${rowCells(p, sign, i===0 ? strikeSet : null)}</div>`;
  }).join('');
  rows += `<div class="ca-line"></div>`;
  if(parsedResult){
    rows += `<div class="ca-row ca-result">${rowCells(parsedResult, '')}</div>`;
  }
  return `<div class="conta-armada">${rows}</div>`;
}

/* ---------------- fração visual: numerador sobre denominador ---------------- */
// parts: array de itens — {n, d} vira uma fração empilhada; string vira operador/texto (+, −, ×, =, ?).
function fracRow(parts){
  const html = parts.map(p=>{
    if(p && typeof p === 'object'){
      return `<span class="frac-item"><span class="num">${p.n}</span><span class="bar"></span><span class="den">${p.d}</span></span>`;
    }
    return `<span class="frac-op">${p}</span>`;
  }).join('');
  return `<div class="frac-row">${html}</div>`;
}

/* ---------------- cadeia de termos: base × base × base = ?, a + b × c = ? ---------------- */
function chainRow(tokens){
  const ops = ['+','−','×','÷','=','∝',':'];
  const html = tokens.map(t=>{
    const s = String(t);
    return `<span class="${ops.includes(s)?'chain-op':'chain-val'}">${s}</span>`;
  }).join('');
  return `<div class="chain-row">${html}</div>`;
}

/* ---------------- escada de passos: cada linha é um estágio da resolução ---------------- */
function stepChain(lines){
  const rows = lines.map((l,i)=> `<div class="eq-line">${l}</div>` + (i<lines.length-1 ? `<div class="eq-arrow">↓</div>` : '')).join('');
  return `<div class="step-chain">${rows}</div>`;
}
// passo a passo completo da fórmula de Bhaskara: mostra a substituição de cada valor (com
// parênteses no b negativo, pra não confundir na hora de elevar ao quadrado), a raiz do
// discriminante calculada à parte, e as duas raízes resolvidas uma de cada vez — em vez de
// pular direto da fórmula pro resultado final.
function bhaskaraSteps(a,b,c){
  const D = b*b - 4*a*c;
  const bStr = b<0 ? `(${b})` : `${b}`;
  const cStr = c<0 ? `(${c})` : `${c}`;
  const fourAC = 4*a*c;
  const fourACLine = fourAC<0 ? `+ ${Math.abs(fourAC)}` : `− ${fourAC}`;
  const negB = -b;
  const negBStr = negB<0 ? `(${negB})` : `${negB}`;
  const steps = [
    `Identifique os coeficientes: a = ${a}, b = ${b}, c = ${c}`,
    `Calcule o discriminante: Δ = b² − 4ac = ${bStr}² − 4×${a}×${cStr} = ${b*b} ${fourACLine} = ${D}`,
  ];
  if(D < 0){
    steps.push(`Δ é negativo (${D}) — não existe raiz quadrada de número negativo, então essa equação não tem solução real.`);
    steps.push(`Conjunto solução: S = { } (conjunto vazio)`);
    return steps;
  }
  const sqrtD = Math.sqrt(D);
  steps.push(`Calcule a raiz do discriminante: √Δ = √${D} = ${fmt(sqrtD)}`);
  const xPlus = (negB + sqrtD) / (2*a), xMinus = (negB - sqrtD) / (2*a);
  if(D === 0){
    steps.push(`Como Δ = 0, as duas raízes são iguais: x = −b / 2a = ${negBStr} / ${2*a} = ${fmt(xPlus)}`);
    steps.push(`Conjunto solução: S = {${fmt(xPlus)}}`);
    return steps;
  }
  steps.push(`Calcule a 1ª raiz (usando +): x' = (−b + √Δ) / 2a = (${negBStr} + ${fmt(sqrtD)}) / ${2*a} = ${fmt(xPlus)}`);
  steps.push(`Calcule a 2ª raiz (usando −): x'' = (−b − √Δ) / 2a = (${negBStr} − ${fmt(sqrtD)}) / ${2*a} = ${fmt(xMinus)}`);
  steps.push(`Raízes: x' = ${fmt(xPlus)}  e  x'' = ${fmt(xMinus)}`);
  steps.push(`Conjunto solução: S = {${fmt(xPlus)}, ${fmt(xMinus)}}`);
  return steps;
}

/* ---------------- cartão de resolução estilo "caderno": a,b,c / Δ em caixa / frações das raízes / S em caixa ---------------- */
/* ---------------- fórmula geral de Bhaskara (reutilizável): x = -b±√Δ/2a, ou seja x = -b±√(b²-4ac)/2a ---------------- */
function bhaskaraFormulaBox(){
  return `<div class="bk-formula-box">
    <div class="bk-formula-row">x = ${fracRow([{n:'−b ± √Δ', d:'2a'}])}</div>
    <div class="bk-formula-sep">ou seja</div>
    <div class="bk-formula-row">x = ${fracRow([{n:'−b ± √(b² − 4ac)', d:'2a'}])}</div>
  </div>`;
}
function bhaskaraCard(a,b,c,skipFormula){
  const D = b*b - 4*a*c;
  const bStr = b<0 ? `(${b})` : `${b}`;
  const cStr = c<0 ? `(${c})` : `${c}`;
  const fourAC = 4*a*c;
  const fourACLine = fourAC<0 ? `+ ${Math.abs(fourAC)}` : `− ${fourAC}`;
  const negB = -b;
  const negBStr = negB<0 ? `(${negB})` : `${negB}`;
  let html = `<div class="bhaskara-card">`;
  html += `<div class="bk-row">a = ${a}, &nbsp;&nbsp; b = ${b}, &nbsp;&nbsp; c = ${c}</div>`;
  html += `<div class="bk-row">Δ = b² − 4ac = ${bStr}² − 4·${a}·${cStr} = ${b*b} ${fourACLine} <span class="bk-badge">Δ = ${D}</span></div>`;
  if(D < 0){
    html += `<div class="bk-row">Não existe raiz quadrada de número negativo — não há solução real.</div>`;
    html += `<div class="bk-final"><span class="bk-badge bk-badge-final">S = { }</span></div></div>`;
    return html;
  }
  const sqrtD = Math.sqrt(D);
  if(!skipFormula) html += `<div class="bk-row">x = (−b ± √Δ) / 2a</div>`;
  if(D === 0){
    const x0 = negB/(2*a);
    html += `<div class="bk-row">x = ${fracRow([{n:negBStr, d:`2·${a}`}])}</div>`;
    html += `<div class="bk-roots"><div class="bk-root-item"><span>x =</span> ${fracRow([{n:negBStr, d:`${2*a}`}])} <span>= ${fmt(x0)}</span></div></div>`;
    html += `<div class="bk-final"><span class="bk-badge bk-badge-final">S = {${fmt(x0)}}</span></div></div>`;
    return html;
  }
  const xPlus = (negB+sqrtD)/(2*a), xMinus = (negB-sqrtD)/(2*a);
  html += `<div class="bk-row">x = ${fracRow([{n:`${negBStr} ± √${D}`, d:`2·${a}`}])}</div>`;
  html += `<div class="bk-row">x = ${fracRow([{n:`${negBStr} ± ${fmt(sqrtD)}`, d:`${2*a}`}])}</div>`;
  html += `<div class="bk-roots">
    <div class="bk-root-item"><span>x₁ =</span> ${fracRow([{n:fmt(negB+sqrtD), d:`${2*a}`}])} <span>= ${fmt(xPlus)}</span></div>
    <div class="bk-root-item"><span>x₂ =</span> ${fracRow([{n:fmt(negB-sqrtD), d:`${2*a}`}])} <span>= ${fmt(xMinus)}</span></div>
  </div>`;
  html += `<div class="bk-final"><span class="bk-badge bk-badge-final">S = {${fmt(xMinus)}, ${fmt(xPlus)}}</span></div></div>`;
  return html;
}

/* ---------------- divisão pela chave: calcula os blocos do algoritmo ---------------- */
// dividend, divisor: inteiros positivos. Retorna {quotient, remainder, blocks}.
// cada block = {current, q, product, newRemainder} — o "current" é o pedaço do dividendo sendo dividido naquele passo.
function longDivisionSteps(dividend, divisor){
  const digits = String(dividend).split('').map(Number);
  let remainder = 0;
  const blocks = [];
  const quotientDigits = [];
  let started = false;
  for(let i=0;i<digits.length;i++){
    remainder = remainder*10 + digits[i];
    if(!started && remainder < divisor && i < digits.length-1){ continue; }
    started = true;
    const q = Math.floor(remainder/divisor);
    const product = q*divisor;
    blocks.push({current: remainder, q, product, newRemainder: remainder-product, endIdx: i});
    quotientDigits.push(q);
    remainder = remainder - product;
  }
  const quotient = quotientDigits.length ? Number(quotientDigits.join('')) : 0;
  return {quotient, remainder, blocks};
}
// monta o visual da "chave": dividendo à esquerda com os passos de subtração, divisor e quociente à direita.
// solved=false mostra só a "casinha" montada (dividendo e divisor), sem os passos nem o quociente — usado na pergunta, sem entregar a resposta.
function divisaoChave(dividend, divisor, solved){
  const totalCols = String(dividend).length;
  function cellsRow(value, endIdx, signChar){
    const s = String(value);
    const cells = new Array(totalCols).fill('\u00A0');
    for(let k=0;k<s.length;k++){
      const col = endIdx - (s.length-1-k);
      if(col>=0 && col<totalCols) cells[col]=s[k];
    }
    let out = `<span class="dc-cell dc-sign">${signChar||''}</span>`;
    cells.forEach(c=>{ out += `<span class="dc-cell">${c}</span>`; });
    return out;
  }
  if(solved===false){
    return `<div class="divisao-chave">
      <div class="dc-left"><div class="dc-row">${cellsRow(dividend, totalCols-1)}</div></div>
      <div class="dc-right">
        <div class="dc-divisor">${divisor}</div>
        <div class="dc-bracket-line"></div>
        <div class="dc-quotient">?</div>
      </div>
    </div>`;
  }
  const {quotient, blocks} = longDivisionSteps(dividend, divisor);
  let leftRows = `<div class="dc-row">${cellsRow(dividend, totalCols-1)}</div>`;
  blocks.forEach((b,i)=>{
    if(i>0){
      leftRows += `<div class="dc-row">${cellsRow(b.current, b.endIdx)}</div>`;
    }
    leftRows += `<div class="dc-row dc-sub">${cellsRow(b.product, b.endIdx, '−')}</div>`;
    leftRows += `<div class="dc-line"></div>`;
  });
  const lastBlock = blocks[blocks.length-1];
  const lastRemainder = lastBlock ? lastBlock.newRemainder : 0;
  const lastEndIdx = lastBlock ? lastBlock.endIdx : totalCols-1;
  leftRows += `<div class="dc-row dc-final">${cellsRow(lastRemainder, lastEndIdx)}</div>`;
  return `<div class="divisao-chave">
    <div class="dc-left">${leftRows}</div>
    <div class="dc-right">
      <div class="dc-divisor">${divisor}</div>
      <div class="dc-bracket-line"></div>
      <div class="dc-quotient">${quotient}</div>
    </div>
  </div>`;
}
// narra o passo a passo em linguagem simples, bloco por bloco.
function divisaoNarrativa(dividend, divisor){
  const {quotient, remainder, blocks} = longDivisionSteps(dividend, divisor);
  const steps = [];
  blocks.forEach((b,i)=>{
    if(i===0){
      steps.push(`Comece olhando o início do dividendo: ${b.current}.`);
    } else {
      steps.push(`Desça o próximo dígito e junte com o resto: forma ${b.current}.`);
    }
    steps.push(`${divisor} cabe ${b.q} ${b.q===1?'vez':'vezes'} em ${b.current}, porque ${b.q} × ${divisor} = ${b.product}.`);
    steps.push(`${b.current} − ${b.product} = ${b.newRemainder}`);
  });
  if(remainder===0) steps.push(`Não sobra nada — a divisão é exata. Quociente: ${quotient}.`);
  else steps.push(`Não há mais dígitos pra descer. Resto final: ${remainder}. Quociente: ${quotient}.`);
  return steps;
}

/* ---------------- potência e raiz: {b,e} vira base com expoente; {root:true,n,e} vira radical ---------------- */
function potRow(parts){
  const ops = ['+','−','×','÷','=','∝',':'];
  const html = parts.map(p=>{
    if(p && typeof p === 'object'){
      if(p.root){
        return `<span class="pot-item root"><span class="pot-index">${p.e && p.e!==2 ? p.e : ''}</span><span class="pot-radical">√</span><span class="pot-under">${p.n}</span></span>`;
      }
      return `<span class="pot-item"><span class="pot-base">${p.b}</span><span class="pot-exp">${p.e}</span></span>`;
    }
    const s = String(p);
    return `<span class="${ops.includes(s)?'chain-op':'chain-val'}">${s}</span>`;
  }).join('');
  return `<div class="chain-row">${html}</div>`;
}
function potStage(html){ return `<div class="pot-stage">${html}</div>`; }
